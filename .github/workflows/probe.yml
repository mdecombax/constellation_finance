name: Probe Yahoo (dérisquage)

# Test manuel : Yahoo bloque-t-il les IP des runners GitHub Actions ?
# Aucune écriture, aucun commit — juste un appel et un verdict dans les logs.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install curl_cffi

      - name: Run probe (quote)
        run: python scraper/probe_yahoo.py

      - name: Run probe (chart/spark diagnostic)
        if: always()
        run: python scraper/probe_chart.py
